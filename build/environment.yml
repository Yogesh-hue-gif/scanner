      - uvicorn==0.32.0
      - python-multipart==0.0.12
      - pydantic==2.9.2
      - onnxruntime==1.19.2
      - torch==2.4.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
      - conda-pack==0.7.1
