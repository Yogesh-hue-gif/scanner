# ==============================================================================
# SpecGuard — Offline Conda-Pack Deployment Environment Specification
# Target: Windows x64 (win-64) | Python 3.11 | Channel: conda-forge
# Fully compliant with SpecGuard Agent Rules (04_ENVIRONMENT_SPECIFICATION_STANDARDS)
# ==============================================================================
name: specguard

channels:
  - conda-forge
  - nodefaults

dependencies:
  # --- Core interpreter (Rule 2: strict Python 3.11 pin) ---
  - python=3.11
  - pip

  # --- Relocation & Packaging Tooling (Rule 4: MANDATORY for conda-unpack.exe) ---
  - conda-pack>=0.8.0

  # --- ASGI Web Framework & Server ---
  - fastapi>=0.100.0,<1.0.0
  - uvicorn>=0.22.0,<1.0.0
  - python-multipart>=0.0.6
  - starlette
  - pydantic>=2.0.0

  # --- Self-Contained Document Parsers (100% Offline) ---
  - pymupdf>=1.22.0
  - python-docx>=0.8.11
  - openpyxl>=3.1.0

  # --- Numerics & Structured Data ---
  - numpy>=1.24.0
  - pandas>=2.0.0
  - pyyaml>=6.0
  - jinja2>=3.1.0

  # --- Computer Vision & Built-in OCR (Zero Tesseract Dependency) ---
  - opencv>=4.7.0

  # --- Offline ML Inference (Rule 3: STRICTLY CPU-ONLY) ---
  - pytorch-cpu>=2.0.0
  - onnx>=1.14.0
  - onnxruntime>=1.15.0

  # --- PDF Report Generation & Imaging ---
  - reportlab>=4.0.0
  - pillow>=10.0.0

  # --- Diagnostics & Telemetry ---
  - psutil

  # --- Testing & Async Transport Fixtures ---
  - pip:
    - httpx>=0.27
    - pytest>=8.0
    - pytest-asyncio>=0.24
