name: specguard
channels:
  - conda-forge
  # NOTE: conda-forge ONLY for win-64 reproducibility.
  # Do NOT re-add `defaults` — mixing channels caused ResolvePackageNotFound.
  # Build/tested on Windows x64 (win-64). Recreate with:
  #   conda env create -f environment.yml
  # For fully offline air-gapped install, unpack
  # SpecGuard-Offline-Conda/environment/specguard-conda.tar.gz instead
  # (contains DLL/PYD/EXE, zero .dylib/.so).
dependencies:
  - python=3.11.16
  - pip=25.0
  - fastapi=0.141.1
  - uvicorn=0.54.0
  - pydantic=2.13.5
  - pymupdf=1.28.0
  - opencv=5.0.0
  - numpy=2.4.6
  - pandas=3.0.6
  - pytorch=2.13.0
  - onnx=1.23.0
  - onnxruntime=1.30.0
  - python-docx=1.2.0
  - openpyxl=3.1.5
  - pyyaml=6.0.3
  - psutil=7.2.2
  - jinja2=3.1.6
  - python-multipart=0.0.32
  - pillow=11.3.0
  - reportlab=4.4.10
  - conda-pack=0.9.2
  - pip:
    - httpx>=0.27
    - pytest>=8.3
    - pytest-asyncio>=0.24
